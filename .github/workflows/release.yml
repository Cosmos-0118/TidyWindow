name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Read version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not in the form v1.2.3."
          }
          "VERSION=$($Matches.version)" | Add-Content -Path $env:GITHUB_ENV
      - name: Restore locked dependencies
        run: dotnet restore TidyWindow.slnx --locked-mode
      - name: Test
        run: |
          dotnet build tests/TidyWindow.Tests/TidyWindow.Tests.csproj -c Release --no-restore
          dotnet test tests/TidyWindow.Tests/TidyWindow.Tests.csproj -c Release --no-build
      - name: Publish self-contained app
        run: dotnet publish app/TidyWindow.Desktop.csproj -c Release --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ env.VERSION }} -o artifacts/publish
      - name: Check the helpers are packaged
        shell: pwsh
        run: |
          foreach ($path in 'TidyWindow.Next.exe', 'CleanHost/TidyWindow.CleanHost.exe', 'ScoutHost/TidyWindow.SearchHost.exe') {
            if (-not (Test-Path (Join-Path artifacts/publish $path))) { throw "Missing from the package: $path" }
          }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/TidyWindow-$env:VERSION-win-x64.zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts/TidyWindow-$env:VERSION-win-x64.zip" --title "TidyWindow $env:VERSION" --generate-notes --verify-tag
