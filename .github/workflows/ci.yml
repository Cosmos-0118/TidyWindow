name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore TidyWindow.slnx --locked-mode
      - name: Build
        run: dotnet build TidyWindow.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/TidyWindow.Tests/TidyWindow.Tests.csproj -c Release --no-build
